# Spendy - configurazione avanzata per Nginx Proxy Manager
# Incolla in Proxy Host -> Advanced.
# Gli header di sicurezza applicativi sono già impostati dal container frontend.

client_max_body_size 10m;
proxy_read_timeout 60s;
proxy_send_timeout 60s;

# HSTS: attivalo in SSL -> HSTS oppure decommenta questa riga, non entrambe.
# add_header Strict-Transport-Security "max-age=31536000" always;
