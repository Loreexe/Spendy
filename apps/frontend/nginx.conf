map $http_x_forwarded_proto $spendy_forwarded_proto {
    default $scheme;
    "~^https$" https;
    "~^http$" http;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    client_max_body_size 10m;

    # Pagina di manutenzione usata durante gli aggiornamenti: il file
    # /etc/nginx/maintenance/on viene creato da scripts/update.sh.
    error_page 503 /maintenance.html;

    location = /maintenance.html {
        internal;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /maintenance.css {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        if (-f /etc/nginx/maintenance/on) {
            return 503;
        }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $spendy_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        if (-f /etc/nginx/maintenance/on) {
            return 503;
        }
        expires 30d;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        if (-f /etc/nginx/maintenance/on) {
            return 503;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        if (-f /etc/nginx/maintenance/on) {
            return 503;
        }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
    }
}
