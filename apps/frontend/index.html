<!doctype html>
<html lang="it" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0B0F0D" />
    <meta name="description" content="Spendy — gestione personale di conti, salvadanai e investimenti." />
    <meta property="og:title" content="Spendy" />
    <meta property="og:description" content="Gestione personale di conti, salvadanai e investimenti." />
    <meta property="og:image" content="/logo/og-1200x630.png" />
    <link rel="icon" type="image/svg+xml" href="/logo/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Spendy</title>
    <script>
      try {
        var t = window.localStorage.getItem("spendy-theme");
        if (t === "dark" || t === "light") {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {
        /* localStorage non disponibile: resta il default scuro. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
