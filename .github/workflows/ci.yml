name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions are aligned with VERSION
        run: python3 scripts/check_version.py
      - name: Version check tests
        run: python3 scripts/test_check_version.py
      - name: Update script syntax
        run: bash -n scripts/update.sh
      - name: Update script tests
        run: bash scripts/test_update.sh

  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controlli del design system
        run: |
          python3 design/checks/check_design.py
          python3 docs/design/build/check_contrast.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: spendy
          POSTGRES_USER: spendy
          POSTGRES_PASSWORD: spendy
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U spendy -d spendy"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DJANGO_SECRET_KEY: ci-secret
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: spendy
      POSTGRES_USER: spendy
      POSTGRES_PASSWORD: spendy
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r apps/backend/requirements.txt
      - name: Django checks
        working-directory: apps/backend
        run: python manage.py check
      - name: Migrations are up to date
        working-directory: apps/backend
        run: python manage.py makemigrations --check --dry-run
      - name: Backend tests
        working-directory: apps/backend
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Lint
        working-directory: apps/frontend
        run: npm run lint
      - name: Build
        working-directory: apps/frontend
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config
